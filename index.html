<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon site</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* Menu */
nav {
    background-color: #333;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    margin: 0 15px;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    color: #00bcd4;
}

/* Sections */
section {
    padding: 60px;
    text-align: center;
}

#accueil {
    background-color: #f4f4f4;
}

#services {
    background-color: #e0f7fa;
}

#contact {
    background-color: #fce4ec;
}

/* Bouton */
button {
    padding: 10px 20px;
    font-size: 16px;
    background-color: #00bcd4;
    border: none;
    color: white;
    cursor: pointer;
}

button:hover {
    background-color: #0097a7;
}
</style>

</head>

<body>

<!-- Menu -->
<nav>
    <a href="#accueil">Accueil</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
</nav>

<!-- Accueil -->
<section id="accueil">
    <h1>Bienvenue sur mon site</h1>
    <p>Voici mon premier site web 🎉</p>
    <button onclick="saluer()">Clique ici</button>
</section>

<!-- Services -->
<section id="services">
    <h2>Mes services</h2>
    <p>Création de sites web simples</p>
</section>

<!-- Contact -->
<section id="contact">
    <h2>Contact</h2>
    <p>Email : exemple@email.com</p>
</section>

<script>
function saluer() {
    alert("Merci de visiter mon site !");
}
</script>

</body>
</html>
